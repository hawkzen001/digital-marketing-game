<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - DigitalMarketer Gamification</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            text-align: center;
        }
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .form-input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(0,0,0,0.2);
            color: var(--text-main);
            font-size: 1rem;
            transition: all 0.3s;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        .error-message {
            color: var(--error);
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
        }
        .logo-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: inline-block;
        }
        .auth-btn {
            width: 100%;
            margin-top: 1rem;
        }
        .switch-auth {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .switch-auth a {
            color: var(--accent-blue);
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="login-container">
        <div class="glass-panel login-card">
            <div class="logo-icon">🚀</div>
            <h1 class="gradient-text" style="margin-bottom: 0.5rem;">Welcome Back</h1>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">Sign in to continue your journey.</p>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" required placeholder="student@idemi.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-input" required placeholder="••••••••">
                </div>
                
                <p id="error-msg" class="error-message"></p>

                <button type="submit" class="primary-btn auth-btn">Sign In</button>
            </form>

            <div class="switch-auth">
                <!-- Removed public admin link -->
            </div>
        </div>
    </div>

    <!-- Admin Role Selection Modal -->
    <div id="admin-role-modal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15,23,42,0.9); z-index: 9999; display: flex; justify-content: center; align-items: center; padding: 1rem;">
        <div class="glass-panel" style="width: 95%; max-width: 400px; max-height: 90vh; overflow-y: auto; padding: 2.5rem; text-align: center;">
            <div style="font-size: 3rem; margin-bottom: 1rem;">👑</div>
            <h2 class="gradient-text" style="margin-bottom: 0.5rem;">Welcome, Admin</h2>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">How would you like to proceed?</p>
            
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <button id="go-admin-btn" class="primary-btn" style="width: 100%;">Enter Admin Dashboard</button>
                <button id="go-student-btn" class="action-btn" style="width: 100%; border: 1px solid var(--glass-border); padding: 0.8rem; border-radius: 8px; background: rgba(255,255,255,0.05); color: white; cursor: pointer;">Play as Student</button>
            </div>
        </div>
    </div>
        </div>
    </div>

    <script type="module" src="login.js"></script>
</body>
</html>
